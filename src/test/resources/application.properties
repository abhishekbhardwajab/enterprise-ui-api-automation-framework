# Non-secret runtime defaults. Override any key per-run with -Dkey=value
# (Maven profiles and the Jenkins pipeline do exactly this for env/execution/headless).

# Target environment identifier - resolved to a base URL via context.Constants.
env=qa

# Rest Assured base URI for the API-testing layer (src/test/.../apiTests).
api.base.url=https://jsonplaceholder.typicode.com

# Local Chrome runs headless by default; set -Dheadless=false to watch it run.
headless=true

implicit.wait.seconds=5
explicit.wait.seconds=10

# Used by RetryAnalyzer (API-testing layer only - see listeners package).
retry.count=2

# BrowserStack build/project naming (used only when execution=remote).
# Username/access key are never stored here - see BROWSERSTACK_USERNAME /
# BROWSERSTACK_ACCESS_KEY environment variables in Driver.
browserstack.build.name=enterprise-ui-api-automation-framework
browserstack.project.name=automationexercise-ui-regression

# Only needed for the @requires-account login scenario. Register a real
# account at https://automationexercise.com/login (or run signup.feature
# once and reuse those details), then fill these in - or inject via
# -Dvalid.username=... -Dvalid.password=... from a CI secret.
valid.username=
valid.password=
